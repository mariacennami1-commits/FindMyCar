name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3

      - name: Check Python
        run: |
          echo "python: $(which python 2>&1 || echo 'NOT FOUND')"
          echo "python3: $(which python3 2>&1 || echo 'NOT FOUND')"
          python --version
          python3 --version

      - name: Install Buildozer
        run: |
          python -m pip install --user buildozer cython

      - name: Verify Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH
          which buildozer 2>/dev/null || echo "no buildozer bin"
          python -m buildozer --version 2>/dev/null || python3 -m buildozer --version 2>/dev/null || echo "buildozer not found"

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug 2>&1 | tee buildozer_output.log

      - name: Show build result
        if: always()
        shell: bash
        run: |
          logfile="buildozer_output.log"
          echo "=== Disk space ==="
          df -h / 2>/dev/null
          echo "=== Log file info ==="
          wc -c "$logfile" 2>/dev/null || echo "(no log)"
          echo "=== Lines in log ==="
          wc -l "$logfile" 2>/dev/null
          echo "=== ERROR/LINE: critical/failed/error/traceback ==="
          grep -in "CRITICAL\|FAILED\|Error\|failed\|error\|Traceback\|Cannot\|No such" "$logfile" 2>/dev/null | head -30 || echo "(no matches, checking last 30 lines...)"
          echo "=== Last 30 lines ==="
          tail -30 "$logfile" 2>/dev/null || echo "(no log file)"
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la bin/ 2>/dev/null || echo "bin/ not found"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_output.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
