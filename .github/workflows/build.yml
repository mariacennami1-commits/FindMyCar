name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython

      - name: Build APK
        continue-on-error: true
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python -m buildozer android debug 2>&1 | tee buildozer_output.log
          exit ${PIPESTATUS[0]:-1}

      - name: Show error tail
        shell: bash
        run: |
          echo "=== Last 30 lines of buildozer output ==="
          tail -30 buildozer_output.log
          echo "=== Lines matching 'error' or 'Error' ==="
          grep -ni "error" buildozer_output.log | tail -10 || echo "(no error matches)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_output.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: bin/*.apk
