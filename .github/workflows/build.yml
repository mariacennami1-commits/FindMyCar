name: Build
on: [push, pull_request]
jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Buildozer
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-
      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python3-dev python-is-python3
      - name: Install Buildozer
        run: |
          python3 -m pip install --user buildozer==1.6.0 cython==0.29.37
      - name: Check buildozer
        shell: bash
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 --version
          python3 -m buildozer --version
      - name: Accept Android licenses
        shell: bash
        run: |
          export PATH=$HOME/.local/bin:$PATH
          mkdir -p ~/.android
          echo 8933bad161af4178b1185d1a37fbf41ea5269c55 > ~/.android/repositories.cfg || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true
          echo "Licenses accepted (or not needed)"
      - name: Build APK
        shell: bash
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -u -m buildozer -v android debug 2>&1 | tee buildozer_output.log
      - name: Show buildozer output
        if: always()
        shell: bash
        run: |
          log=buildozer_output.log
          if [ ! -f "$log" ]; then
            echo "NO LOG FILE"
          else
            echo "=== File info ==="
            wc -c "$log"
            wc -l "$log"
            echo "=== Full log ==="
            cat "$log"
            echo ""
            echo "=== Errors ==="
            grep -in "404\|error\|failed\|not found\|traceback\|exception" "$log" 2>/dev/null | head -30 || echo "(none)"
            echo ""
            echo "=== Warnings ==="
            grep -in "warning\|cannot\|missing" "$log" 2>/dev/null | head -20 || echo "(none)"
          fi
      - name: Upload buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-log
          path: buildozer_output.log
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
          if-no-files-found: ignore