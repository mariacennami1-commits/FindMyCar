name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3

      - name: Install Buildozer (stable)
        run: |
          python -m pip install --user buildozer cython

      - name: Pre-download SDK & NDK in buildozer format
        shell: bash
        run: |
          set -e
          mkdir -p ~/.buildozer/android/platform
          # SDK command line tools
          echo "=== SDK tools ==="
          curl -sL -o /tmp/sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk
          unzip -q /tmp/sdk.zip -d /tmp/sdk-tools
          mv /tmp/sdk-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "platforms;android-34" "build-tools;34.0.0"
          # NDK
          echo "=== NDK r25c ==="
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d ~/.buildozer/android/platform/
          echo "=== Pre-download done ==="
          ls ~/.buildozer/android/platform/

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug 2>&1 | tee buildozer_output.log

      - name: Show buildozer output
        if: always()
        shell: bash
        run: |
          if [ -f buildozer_output.log ]; then
            echo "=== Last 30 lines ==="
            tail -30 buildozer_output.log
            echo "=== Lines with error/404 ==="
            grep -inP "404|error|failed|HTTPError|not found" buildozer_output.log | head -20
            echo "=== Download URLs ==="
            grep -inP "download|http.*\.zip|http.*\.tar" buildozer_output.log | head -10
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
