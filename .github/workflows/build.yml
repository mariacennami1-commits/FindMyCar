name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython

      - name: Check environment
        shell: bash
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Disk ==="
          df -h /
          echo "=== Pip ==="
          pip --version

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python -m buildozer android debug 2>&1 | tee buildozer_output.log
          exit ${PIPESTATUS[0]}

      - name: Show buildozer log
        if: always()
        shell: bash
        run: |
          echo "=== Last 100 lines of buildozer output ==="
          tail -100 buildozer_output.log 2>/dev/null || echo "No output file"
          echo "=== Buildozer internal logs ==="
          find ~/.buildozer -name "*.log" -o -name "*.txt" 2>/dev/null | head -5
          for log in $(find ~/.buildozer -name "*.log" 2>/dev/null | head -3); do
            echo "--- Log: $log ---"
            tail -50 "$log"
          done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            buildozer_output.log
            .buildozer/*.log
