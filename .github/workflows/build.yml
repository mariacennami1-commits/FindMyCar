name: Build
on: [push, pull_request]
jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Buildozer
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-
      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3
      - name: Install Buildozer (stable)
        run: |
          python -m pip install --user buildozer cython
      - name: Check buildozer
        shell: bash
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 --version
          python3 -c "import buildozer; print('buildozer:', buildozer.__file__)"
          python3 -m buildozer --version
      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug 2>&1 | tee buildozer_output.log
      - name: Show buildozer output
        if: always()
        shell: bash
        run: |
          log=buildozer_output.log
          if [ ! -f "$log" ]; then
            echo "NO LOG FILE"
          else
            echo "=== Last 30 lines ==="
            tail -30 "$log"
            echo "=== Errors ==="
            grep -i "404\|error\|failed\|not found" "$log" 2>/dev/null | head -20 || echo "(none)"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk