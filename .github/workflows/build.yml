name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3

      - name: Install Buildozer
        run: |
          python -m pip install --user buildozer cython

      - name: Download Android SDK & NDK
        id: setup
        shell: bash
        run: |
          mkdir -p ~/.buildozer/android
          echo "=== Download SDK tools ==="
          curl -sL -o /tmp/sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdk-tools
          mkdir -p ~/.buildozer/android/sdk/cmdline-tools
          mv /tmp/sdk-tools/cmdline-tools ~/.buildozer/android/sdk/cmdline-tools/latest
          echo "=== Download NDK r25c ==="
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d ~/.buildozer/android/ndk
          mv ~/.buildozer/android/ndk/android-ndk-r25c ~/.buildozer/android/ndk/r25c
          echo "=== Install Android 34 platform ==="
          yes | ~/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          echo "=== SDK/NDK ready ==="

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
