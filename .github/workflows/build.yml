name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3

      - name: Install Buildozer
        run: |
          python -m pip install --user buildozer cython

      - name: Download Android SDK & NDK
        id: setup
        shell: bash
        run: |
          set -e
          mkdir -p ~/.buildozer/android
          echo "=== Try URL 1 ==="
          curl -sLI "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" | head -5 || echo "FAILED"
          echo "=== Try URL 2 (older) ==="
          curl -sLI "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" | head -5 || echo "FAILED"
          echo "=== Try NDK r25c ==="
          curl -sLI "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" | head -5 || echo "FAILED"
          echo "=== Try NDK r26b ==="
          curl -sLI "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" | head -5 || echo "FAILED"
          echo "=== Try NDK r27 ==="
          curl -sLI "https://dl.google.com/android/repository/android-ndk-r27-linux.zip" | head -5 || echo "FAILED"
          echo "=== Test network ==="
          curl -sI "https://google.com" | head -3

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
