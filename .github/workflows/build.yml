name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev openjdk-17-jdk python3-pip python3-setuptools python-is-python3

      - name: Install Buildozer (stable)
        run: |
          python -m pip install --user buildozer cython

      - name: Pre-download SDK & NDK in buildozer format
        continue-on-error: true
        shell: bash
        run: |
          set -x
          echo "=== Create platform dir ==="
          mkdir -p ~/.buildozer/android/platform
          SDK_ROOT=~/.buildozer/android/platform/android-sdk

          echo "=== SDK tools ==="
          curl -sL -o /tmp/sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          unzip -q /tmp/sdk-tools.zip -d /tmp/sdk-tools-extract
          cp -r /tmp/sdk-tools-extract/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          rm -rf /tmp/sdk-tools-extract /tmp/sdk-tools.zip

          echo "=== Run sdkmanager ==="
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --list 2>&1 | head -5 || echo "sdkmanager list failed"
          echo y | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-34" 2>&1 || echo "sdkmanager platform failed"
          echo y | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "build-tools;34.0.0" 2>&1 || echo "sdkmanager build-tools failed"

          echo "=== NDK r25c ==="
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d ~/.buildozer/android/platform/
          rm -f /tmp/ndk.zip

          echo "=== Done ==="
          ls -d ~/.buildozer/android/platform/*/

      - name: Check buildozer
        shell: bash
        run: |
          export PATH=$HOME/.local/bin:$PATH
          echo "=== python3 ==="
          which python3
          python3 --version
          echo "=== pip3 list ==="
          pip3 list --user 2>/dev/null | grep -i buildozer || echo "NO BUILDozER IN USER PIP"
          python3 -c "import buildozer; print('buildozer:', buildozer.__file__)" 2>&1 || echo "BUILDozER IMPORT FAILED"
          echo "=== buildozer --version ==="
          python3 -m buildozer --version 2>&1 || echo "BUILDozER MODULE FAILED"

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set +e
          export PATH=$HOME/.local/bin:$PATH
          python3 -m buildozer android debug 2>&1 | tee buildozer_output.log
          exit ${PIPESTATUS[0]}

      - name: Show buildozer output
        if: always()
        shell: bash {0}
        run: |
          log=buildozer_output.log
          if [ ! -f "$log" ]; then
            echo "=== NO LOG FILE ==="
            ls -la . 2>/dev/null
            find . -name "*.log" -o -name "buildozer*" 2>/dev/null | head -10
          else
            echo "=== Log size: $(wc -c < "$log") bytes ==="
            echo "=== Last 30 lines ==="
            tail -30 "$log"
            echo "=== Errors ==="
            grep -iP "404|error|failed|HTTPError|not found" "$log" 2>/dev/null | head -20 || echo "(no error matches)"
            echo "=== ALL HTTP URLs in log ==="
            grep -oP 'https?://[^ ">)]+' "$log" 2>/dev/null | sort -u | head -20 || echo "(no URLs)"
            echo "=== Lines around 404 ==="
            grep -n "404" "$log" 2>/dev/null | head -5
            echo "=== Lines around Downloading ==="
            grep -n "Downloading\|download" "$log" 2>/dev/null | head -10
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: |
            bin/*.apk
            *.apk
