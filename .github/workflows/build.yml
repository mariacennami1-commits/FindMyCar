name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK
          path: ${{ steps.buildozer.outputs.filename }}

  build-android-direct:
    name: Build Direct (fallback)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y git zip unzip python3-pip python3-setuptools autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk
          pip install --user buildozer cython

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          python -m buildozer android debug 2>&1

      - name: Upload APK (direct)
        uses: actions/upload-artifact@v4
        with:
          name: FindMyCar-APK-direct
          path: bin/*.apk
